<script>
  let currentTemperature = 24;
  const minTemp = 16;
  const maxTemp = 32;
  let isPoweredOn = true;

  function updateSliderDisplay() {
    const targetEl = document.getElementById('target-temp');
    const unitEl = document.getElementById('unit-display');
    const fillEl = document.getElementById('slider-fill');
    const thumbEl = document.getElementById('slider-thumb');

    if (targetEl) targetEl.innerText = currentTemperature;
    if (unitEl) unitEl.innerText = currentTemperature;

    const percentage = ((currentTemperature - minTemp) / (maxTemp - minTemp)) * 100;
    if (fillEl) fillEl.style.width = percentage + '%';
    if (thumbEl) thumbEl.style.left = percentage + '%';
  }

  function adjustTemp(delta) {
    if (!isPoweredOn) return;
    const next = currentTemperature + delta;
    if (next >= minTemp && next <= maxTemp) {
      currentTemperature = next;
      updateSliderDisplay();
    }
  }

  function togglePower() {
    isPoweredOn = !isPoweredOn;
    const halo = document.getElementById('pwr-halo');
    const inner = document.getElementById('pwr-inner');
    const unitDisplay = document.getElementById('unit-display');

    if (isPoweredOn) {
      if (halo) halo.classList.remove('opacity-0');
      if (inner) inner.classList.add('text-primary-container');
      if (unitDisplay) unitDisplay.innerText = currentTemperature;
    } else {
      if (halo) halo.classList.add('opacity-0');
      if (inner) inner.classList.remove('text-primary-container');
      if (unitDisplay) unitDisplay.innerText = '--';
    }
  }

  function toggleCard(button) {
    button.classList.toggle('bg-surface-container-high');
    button.classList.toggle('shadow-[0_0_16px_rgba(0,229,255,0.25)]');
  }

  updateSliderDisplay();
</script></main></body></html>
